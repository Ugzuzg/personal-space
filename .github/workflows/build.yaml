name: Build website

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache
        uses: actions/cache@v6
        id: cache
        with:
          path: cache-mount
          key: cache-mount-${{ hashFiles('website/Dockerfile') }}

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: website/Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/ugzuzg/personal-space-website
          tags: |
            type=sha
            type=edge

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: website/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            env=${{ secrets.BUILD_ENV }}
          cache-from: type=registry,ref=ghcr.io/ugzuzg/personal-space-website:buildcache
          cache-to: type=registry,ref=ghcr.io/ugzuzg/personal-space-website:buildcache,mode=max
